[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force --class=DatabaseSeeder && php artisan config:cache && php artisan route:cache && php -S 0.0.0.0:$PORT -t public"
